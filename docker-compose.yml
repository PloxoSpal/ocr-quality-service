services:
  ocr-quality:
    build: .
    image: ocr-quality:latest
    ports:
      - "8000:8000"
    environment:
      # Размер пула должен совпадать с лимитом CPU ниже: внутри контейнера Python
      # видит все CPU хоста, а не квоту cgroup.
      WORKERS: "4"
      MAX_REQUESTS: "16"
      MAX_UPLOAD_MB: "50"
      LOG_LEVEL: "INFO"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2g
    restart: unless-stopped
